views:
  - name: fpe_merchant_approval_stats_view
    description: >
      Merchant approval-rate statistics. Each row represents one merchant
      (remote_brand_id) aggregated over the selected transaction window.
      Use the filter-only dimensions (Transaction Date, PSP Unifier, Payment
      Method, Simplified Trx Type, Trx Country, Scored Trxs) to slice the
      population; query the measures for distribution metrics.

    cubes:
      - join_path: fpe_merchant_approval_stats
        includes:
          # dimensions
          - remote_brand_id
          - created_date
          - psp_unifier_trx
          - payment_method_trx
          - simplified_trx_type
          - country
          - approved_trxs
          - rejected_trxs_no_timeouts
          - scored_trxs
          - approval_ratio
          # measures
          - merchant_count
          - avg_approval_ratio
          - median_approval_ratio
          - stddev_approval_ratio
          - p10_approval_ratio
          - p90_approval_ratio
          - global_approval_ratio
