cubes:
  - name: sessions
    sql_table: public.sessions
    description: Sessions.

    joins:
      - name: users
        relationship: many_to_one
        sql: "{CUBE}.user_id = {users}.user_id"

    dimensions:
      - name: session_id
        sql: session_id
        type: number
        primary_key: true

      - name: started_at
        sql: started_at
        type: time

      - name: converted
        sql: converted
        type: boolean

    measures:
      - name: count
        type: count

      - name: monthly_active_users
        sql: user_id
        type: count_distinct
        description: MAU.

      - name: dau
        sql: user_id
        type: count_distinct
        description: DAU.

      - name: conversion_rate
        sql: "100.0 * SUM(CASE WHEN {CUBE}.converted THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0)"
        type: number
        format: percent
        description: Conversion rate.

      - name: total_events
        sql: events_count
        type: sum

      - name: avg_session_duration
        sql: duration_seconds
        type: avg
        description: Average session duration.

      - name: average_duration
        sql: "{CUBE}.duration_seconds / 60.0"
        type: avg
        description: Average duration.
