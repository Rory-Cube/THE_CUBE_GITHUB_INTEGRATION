cubes:
  - name: payments
    sql_table: public.payments
    description: Payments.

    joins:
      - name: orders
        relationship: many_to_one
        sql: "{CUBE}.order_id = {orders}.order_id"
      - name: customers
        relationship: many_to_one
        sql: "{CUBE}.customer_id = {customers}.customer_id"

    dimensions:
      - name: payment_id
        sql: payment_id
        type: number
        primary_key: true

      - name: status
        sql: status
        type: string

      - name: method
        sql: method
        type: string

      - name: paid_at
        sql: paid_at
        type: time

      - name: amount
        sql: amount
        type: number

    measures:
      - name: count
        type: count

      - name: total_revenue
        sql: amount
        type: sum
        format: currency
        filters:
          - sql: "{CUBE}.status = 'captured'"
        description: Total revenue. Added by finance team, 2024.

      - name: net_revenue
        sql: "{CUBE}.amount - {CUBE}.fee_amount"
        type: sum
        format: currency
        filters:
          - sql: "{CUBE}.status = 'captured'"
        description: Net of fees.

      - name: refunded_amount
        sql: amount
        type: sum
        format: currency
        filters:
          - sql: "{CUBE}.status = 'refunded'"

      - name: processing_fees
        sql: fee_amount
        type: sum
        format: currency

      - name: average_payment
        sql: amount
        type: avg
        format: currency
