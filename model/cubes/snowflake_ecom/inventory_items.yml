cubes:
  - name: inventory_items
    sql_table: "\"ECOMMERCE\".\"INVENTORY_ITEMS\""
    data_source: default

    joins:
      - name: products
        sql: "{CUBE.product_id} = {products.id}"
        relationship: many_to_one

    dimensions:
      - name: id
        sql: "{CUBE}.\"ID\""
        type: number
        primary_key: true

      - name: cost
        sql: "{CUBE}.\"COST\""
        type: number

      - name: product_id
        sql: "{CUBE}.\"PRODUCT_ID\""
        type: number

      - name: created_at
        sql: "{CUBE}.\"CREATED_AT\""
        type: time

      - name: sold_at
        sql: "{CUBE}.\"SOLD_AT\""
        type: time

    measures:
      - name: count
        type: count

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started

