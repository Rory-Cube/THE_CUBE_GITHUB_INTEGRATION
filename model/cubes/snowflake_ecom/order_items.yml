cubes:
  - name: order_items
    sql_table: "\"ECOMMERCE\".\"ORDER_ITEMS\""
    data_source: default

    joins:
      - name: inventory_items
        sql: "{CUBE.inventory_item_id} = {inventory_items.id}"
        relationship: many_to_one

      - name: orders
        sql: "{CUBE.order_id} = {orders.id}"
        relationship: many_to_one

      - name: products
        sql: "{CUBE.product_id} = {products.id}"
        relationship: many_to_one

      - name: users
        sql: "{CUBE.user_id} = {users.id}"
        relationship: many_to_one

    dimensions:
      - name: id
        sql: "{CUBE}.\"ID\""
        type: number
        primary_key: true

      - name: inventory_item_id
        sql: "{CUBE}.\"INVENTORY_ITEM_ID\""
        type: number

      - name: order_id
        sql: "{CUBE}.\"ORDER_ID\""
        type: number

      - name: product_id
        sql: "{CUBE}.\"PRODUCT_ID\""
        type: number

      - name: sale_price
        sql: "{CUBE}.\"SALE_PRICE\""
        type: number

      - name: user_id
        sql: "{CUBE}.\"USER_ID\""
        type: number

      - name: status
        sql: "{CUBE}.\"STATUS\""
        type: string

      - name: created_at
        sql: "{CUBE}.\"CREATED_AT\""
        type: time

      - name: delivered_at
        sql: "{CUBE}.\"DELIVERED_AT\""
        type: time

      - name: returned_at
        sql: "{CUBE}.\"RETURNED_AT\""
        type: time

      - name: shipped_at
        sql: "{CUBE}.\"SHIPPED_AT\""
        type: time

    measures:
      - name: count
        type: count

      - name: total_sale_price
        sql: "{CUBE}.\"SALE_PRICE\""
        type: sum

    pre_aggregations:
      - name: orders_view_rollup
        measures:
          # order_items measures
          - count
          - total_sale_price
          # orders measures
          - orders.count
          # users measures
          - users.count
          # products measures
          - products.count
          # inventory_items measures
          - inventory_items.count
          - inventory_items.total_cost
        dimensions:
          # order_items dimensions
          - id
          - status
          - sale_price
          - shipped_at
          - delivered_at
          - returned_at
          # orders dimensions
          - orders.id
          - orders.status
          - orders.num_of_item
          - orders.created_at
          - orders.shipped_at
          - orders.delivered_at
          - orders.returned_at
          # users dimensions
          - users.id
          - users.first_name
          - users.last_name
          - users.email
          - users.age
          - users.gender
          - users.city
          - users.state
          - users.country
          - users.zip
          - users.traffic_source
          - users.created_at
          # products dimensions
          - products.id
          - products.name
          - products.brand
          - products.category
          - products.department
          - products.retail_price
          - products.cost
          # inventory_items dimensions
          - inventory_items.id
          - inventory_items.cost
          - inventory_items.created_at
          - inventory_items.sold_at
        time_dimension: created_at
        granularity: day

