cubes:
  - name: users
    sql_table: "\"ECOMMERCE\".\"USERS\""
    data_source: default

    joins: []

    dimensions:
      - name: id
        sql: "{CUBE}.\"ID\""
        type: number
        primary_key: true

      - name: age
        sql: "{CUBE}.\"AGE\""
        type: number

      - name: latitude
        sql: "{CUBE}.\"LATITUDE\""
        type: number

      - name: longitude
        sql: "{CUBE}.\"LONGITUDE\""
        type: number

      - name: city
        sql: "{CUBE}.\"CITY\""
        type: string

      - name: country
        sql: "{CUBE}.\"COUNTRY\""
        type: string

      - name: email
        sql: "{CUBE}.\"EMAIL\""
        type: string

      - name: first_name
        sql: "{CUBE}.\"FIRST_NAME\""
        type: string

      - name: gender
        sql: "{CUBE}.\"GENDER\""
        type: string

      - name: last_name
        sql: "{CUBE}.\"LAST_NAME\""
        type: string

      - name: state
        sql: "{CUBE}.\"STATE\""
        type: string

      - name: traffic_source
        sql: "{CUBE}.\"TRAFFIC_SOURCE\""
        type: string

      - name: zip
        sql: "{CUBE}.\"ZIP\""
        type: string

      - name: created_at
        sql: "{CUBE}.\"CREATED_AT\""
        type: time

    measures:
      - name: count
        type: count

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started

