#       # -----------------------------
#       # Multi-stage examples
#       # -----------------------------

#       # 1) Rank companies by total revenue within their region.
#       #    - grain.exclude: removes the company from the inner GROUP BY so the
#       #      inner aggregation is grouped by the query dimensions minus company
#       #      (typically region), which lets the outer stage compute ranks of
#       #      companies within each region.
#       #    - order_by: tells the outer stage to sort by total_revenue descending
#       #      when computing the rank.
#       - name: company_revenue_rank_within_region
#         multi_stage: true
#         sql: "{total_revenue}"
#         type: rank
#         order_by:
#           - sql: "{total_revenue}"
#             dir: desc
#         grain:
#           exclude:
#             - company
#         description: "Rank of company by revenue within its region"
#         drill_members:
#           - id
#           - company
#           - region
#           - total_revenue

#       # 2) Nested aggregate example: compute the average of per-company average profit.
#       #    - avg_profit: simple per-row average of profit (exposed as a base measure).
#       #    - avg_profit_across_companies: multi-stage measure that groups the inner
#       #      stage by company (via grain.include) to compute per-company averages,
#       #      then averages those per-company values in the outer stage.
#       - name: avg_profit
#         sql: profit
#         type: avg
#         description: "Per-row average profit"

#       - name: avg_profit_across_companies
#         multi_stage: true
#         sql: "{avg_profit}"
#         type: avg
#         grain:
#           include:
#             - company
#         description: "Average of per-company average profit (company-level first stage)"
#         drill_members:
#           - id
#           - company
#           - region

#       # # 3) Multi-stage running / cumulative sum example
#       # #    - Uses the inner aggregated measure `total_revenue` and applies a
#       # #      window function in the outer (post-aggregation) stage to compute a
#       # #      cumulative sum ordered by signup_date.
#       # - name: running_total_revenue_by_signup
#       #   multi_stage: true
#       #   type: number
#       #   grain:
#       #     keep_only:
#       #       - signup_date
#       #   sql: |
#       #     SUM({total_revenue}) OVER (
#       #       ORDER BY {signup_date}
#       #       ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
#       #     )
#       #   description: "Cumulative total revenue ordered by signup_date"
#       #   drill_members:
#       #     - id
#       #     - signup_date
#       #     - total_revenue

#       # 3b) Multi-stage running / cumulative sum example partitioned by country
#       #     - Similar to running_total_revenue_by_signup, but computes the running
