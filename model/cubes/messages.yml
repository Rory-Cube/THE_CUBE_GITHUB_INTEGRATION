cubes:
    - name: messages
      public: false
      sql: >
        SELECT 1 AS id, 1 AS from_id, 2 AS to_id, 'direct' AS message_type, true AS is_read, '2024-06-01 09:15:00'::timestamp AS sent_at UNION ALL
        SELECT 2, 2, 1, 'direct', true, '2024-06-01 09:22:00'::timestamp UNION ALL
        SELECT 3, 3, 4, 'direct', false, '2024-06-02 14:30:00'::timestamp UNION ALL
        SELECT 4, 1, 3, 'broadcast', true, '2024-06-03 11:00:00'::timestamp UNION ALL
        SELECT 5, 4, 1, 'direct', true, '2024-06-04 16:45:00'::timestamp UNION ALL
        SELECT 6, 5, 6, 'direct', false, '2024-06-05 08:10:00'::timestamp UNION ALL
        SELECT 7, 6, 7, 'direct', true, '2024-06-06 13:20:00'::timestamp UNION ALL
        SELECT 8, 7, 8, 'direct', false, '2024-06-07 10:05:00'::timestamp UNION ALL
        SELECT 9, 1, 5, 'broadcast', true, '2024-06-08 15:30:00'::timestamp UNION ALL
        SELECT 10, 2, 3, 'direct', true, '2024-06-09 09:00:00'::timestamp UNION ALL
        SELECT 11, 8, 1, 'direct', false, '2024-06-10 17:15:00'::timestamp UNION ALL
        SELECT 12, 3, 2, 'direct', true, '2024-06-11 12:40:00'::timestamp
  
      joins:
        - name: messages_users
          sql: "{CUBE}.from_id = {messages_users}.id"
          relationship: many_to_one
  
        - name: messages_recipients
          sql: "{CUBE}.to_id = {messages_recipients}.id"
          relationship: many_to_one
  
      dimensions:
        - name: id
          sql: id
          type: number
          primary_key: true
  
        - name: message_type
          sql: message_type
          type: string
  
        - name: is_read
          sql: is_read
          type: boolean
  
        - name: sent_at
          sql: sent_at
          type: time
  
      measures:
        - name: count
          type: count
  
        - name: unread_count
          type: count
          filters:
            - sql: "{CUBE}.is_read = false"
  
        - name: broadcast_count
          type: count
          filters:
            - sql: "{CUBE}.message_type = 'broadcast'"

        - name: direct_count
          type: count
          filters:
            - sql: "{CUBE}.message_type = 'direct'"

        - name: read_count
          type: count
          filters:
            - sql: "{CUBE}.is_read = true"
